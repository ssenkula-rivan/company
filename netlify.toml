[build]
  command = "npm run build"
  publish = "out"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

# Disable problematic plugins
[[plugins]]
  package = "netlify-purge-cloudflare-on-deploy"
  
  [plugins.inputs]
    enabled = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
